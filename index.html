<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Portafolio creativo: 3D, Diseño Gráfico y Programación de Software y Web.">
<title>Estudio Prisma — Portafolio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 29 26H3L16 3Z' fill='none' stroke='%2322d3ee' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/400.css">
<style>
:root{
  --bg:#0b0b12; --panel:#141420; --text:#e8eaf2; --muted:#9aa0b5;
  --c3d:#22d3ee; --cgraf:#f472b6; --cdev:#a3e635; --violet:#a78bfa;
  --grad:linear-gradient(92deg,#22d3ee,#a78bfa 45%,#f472b6);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
::selection{background:#a78bfa;color:#0b0b12}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#26263a;border-radius:99px}
.mono{font-family:'JetBrains Mono',monospace}
.muted{color:var(--muted)}
section,footer{scroll-margin-top:80px}

/* ---------- Loader ---------- */
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;z-index:200;transition:opacity .5s}
#loader.fin{opacity:0;pointer-events:none}
#loader p{font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.3em;color:var(--muted)}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:#22d3ee;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.error-carga{text-align:center;max-width:460px;padding:0 22px;line-height:1.7;color:var(--muted)}
.error-carga h2{color:var(--text);margin-bottom:12px}
.error-carga code{background:#1a1a2a;border:1px solid #2a2a3f;padding:2px 7px;border-radius:6px;color:#22d3ee}

/* ---------- Header ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 5vw;transition:.3s;border-bottom:1px solid transparent}
header.scrolled{background:rgba(11,11,18,.78);backdrop-filter:blur(14px);border-bottom-color:rgba(255,255,255,.07)}
.logo{display:flex;gap:10px;align-items:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.02rem;letter-spacing:.02em;text-decoration:none;color:#fff;white-space:nowrap}
.logo svg{width:26px;height:26px;flex:0 0 auto}
nav.links{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none}
nav.links::-webkit-scrollbar{display:none}
nav.links a{color:var(--muted);text-decoration:none;font-size:.88rem;font-weight:500;transition:.2s;white-space:nowrap}
nav.links a:hover{color:#fff}
.count-chip{font-family:'JetBrains Mono',monospace;font-size:.7rem;border:1px solid rgba(255,255,255,.15);padding:6px 12px;border-radius:99px;color:var(--muted);white-space:nowrap}
@media(max-width:860px){nav.links{display:none}}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;animation:float 14s ease-in-out infinite alternate;pointer-events:none}
.o1{width:480px;height:480px;background:#22d3ee;top:-140px;left:-120px}
.o2{width:420px;height:420px;background:#a78bfa;bottom:10%;right:-140px;animation-delay:-4s}
.o3{width:300px;height:300px;background:#f472b6;top:30%;left:55%;animation-delay:-8s}
@keyframes float{to{transform:translate(40px,-30px) scale(1.08)}}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 75%)}
.hero-inner{margin:auto 0;padding:150px 5vw 70px;position:relative;z-index:2}
.eyebrow{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.35em;font-size:.72rem;color:var(--muted);margin-bottom:22px}
.hero h1{font-size:clamp(2.7rem,8.2vw,6.6rem);line-height:1.02;letter-spacing:-.03em;font-weight:700}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:54ch;color:var(--muted);font-size:1.08rem;margin-top:26px;line-height:1.75}
.hero-cta{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--grad);color:#0b0b12;border:0;padding:13px 24px;border-radius:12px;font-weight:600;font-size:.94rem;text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .2s;font-family:'Inter',sans-serif}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(167,139,250,.55)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.18)}
.btn.ghost:hover{border-color:rgba(255,255,255,.4);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:.82rem;border-radius:9px}
.stats{display:flex;gap:clamp(26px,6vw,80px);margin-top:64px;flex-wrap:wrap}
.stat b{font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700}
.stat span{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}
.marquee{border-block:1px solid rgba(255,255,255,.08);overflow:hidden;padding:15px 0;background:rgba(255,255,255,.02);position:relative;z-index:2}
.marquee-track{display:flex;width:max-content;animation:mq 30s linear infinite}
.mq-group{display:flex;gap:48px;padding-right:48px}
.mq-group span{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted);white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- Secciones por área ---------- */
section.area{padding:110px 5vw;border-top:1px solid rgba(255,255,255,.06);position:relative}
section.area::before{content:'';position:absolute;top:0;left:0;right:0;height:340px;background:radial-gradient(600px 220px at 12% 0%,color-mix(in srgb,var(--ac) 12%,transparent),transparent 70%);pointer-events:none}
.area-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:52px;flex-wrap:wrap;position:relative}
.area-num{font-family:'JetBrains Mono',monospace;color:var(--ac);font-size:.74rem;letter-spacing:.3em;margin-bottom:14px}
.area-head h2{font-size:clamp(2rem,4.6vw,3.4rem);letter-spacing:-.02em}
.area-head p{color:var(--muted);max-width:48ch;margin-top:12px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
.card{position:relative;border-radius:18px;overflow:hidden;background:var(--panel);border:1px solid rgba(255,255,255,.07);cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.card:hover{transform:translateY(-6px);box-shadow:0 26px 50px -22px rgba(0,0,0,.7);border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.card:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
@media(min-width:720px){.card.featured{grid-column:span 2}.card.featured .card-img{aspect-ratio:16/8}}
.card-img{aspect-ratio:4/3;overflow:hidden;position:relative;background:#0d0d16}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .card-img img{transform:scale(1.06)}
.card-img::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(10,10,16,.85))}
.chip{position:absolute;top:14px;left:14px;z-index:2;font-family:'JetBrains Mono',monospace;font-size:.66rem;padding:6px 11px;border-radius:99px;background:rgba(10,10,16,.6);backdrop-filter:blur(8px);color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent)}
.chip-video{left:auto;right:14px;color:#fff;border-color:rgba(255,255,255,.25)}
.card-body{padding:18px 20px 20px}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card-top h3{font-size:1.14rem;letter-spacing:-.01em}
.anio{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--muted)}
.cliente{color:var(--muted);font-size:.82rem;margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tool{font-size:.72rem;font-family:'JetBrains Mono',monospace;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:#cfd3e2}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:4vh 4vw}
.modal.open{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(5,5,10,.82);backdrop-filter:blur(10px)}
.modal-box{position:relative;width:min(1100px,100%);max-height:92vh;overflow:auto;background:#101018;border:1px solid rgba(255,255,255,.1);border-radius:20px;display:grid;grid-template-columns:1.4fr 1fr}
@media(max-width:880px){.modal-box{grid-template-columns:1fr}}
.close-btn{position:absolute;top:14px;right:14px;z-index:20;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(10,10,16,.6);color:#fff;font-size:1rem;cursor:pointer;backdrop-filter:blur(6px)}
.media{position:relative;background:#000;aspect-ratio:16/10;min-height:280px}
.slide-host{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .18s}
.slide-host img{max-width:100%;max-height:100%;object-fit:contain}
.slide-host iframe,.slide-host video{width:100%;height:100%;border:0}
.sin-media{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.8rem}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(10,10,16,.55);color:#fff;font-size:1rem;cursor:pointer;backdrop-filter:blur(6px);transition:.2s}
.nav-arrow:hover{background:rgba(30,30,50,.8)}
.nav-arrow.prev{left:14px}.nav-arrow.next{right:14px}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5}
.dot{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.35);border:0;cursor:pointer;transition:.25s;padding:0}
.dot.active{background:#fff;width:22px}
.info{padding:30px;display:flex;flex-direction:column;gap:16px}
.info .chip{position:static;display:inline-block;width:fit-content}
.info h3{font-size:1.7rem;letter-spacing:-.02em}
.desc{color:var(--muted);line-height:1.7;font-size:.95rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:.88rem}
.kv dt{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;padding-top:3px}
.kv-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.enlaces{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Footer ---------- */
footer{border-top:1px solid rgba(255,255,255,.08);padding:100px 5vw 40px;position:relative;overflow:hidden}
footer::before{content:'';position:absolute;bottom:-200px;left:20%;width:600px;height:400px;background:radial-gradient(closest-side,rgba(167,139,250,.18),transparent);pointer-events:none}
footer h2{font-size:clamp(2rem,5.4vw,4.2rem);letter-spacing:-.03em;line-height:1.1;margin:18px 0 30px}
.email-link{display:inline-block;font-family:'Space Grotesk',sans-serif;font-size:clamp(1.1rem,3vw,1.9rem);color:#fff;text-decoration:none;border-bottom:2px solid transparent;background:linear-gradient(var(--grad),var(--grad)) no-repeat 0 100%/0% 2px;transition:background-size .4s;padding-bottom:4px}
.email-link:hover{background-size:100% 2px}
.socials{display:flex;gap:20px;margin-top:34px;flex-wrap:wrap}
.socials a{color:var(--muted);text-decoration:none;font-size:.9rem;transition:.2s}
.socials a:hover{color:#fff}
.small-print{display:flex;justify-content:space-between;color:var(--muted);font-size:.74rem;margin-top:70px;flex-wrap:wrap;gap:12px;font-family:'JetBrains Mono',monospace}

/* ---------- Reveal ---------- */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
.reveal.visible{opacity:1;transform:none}
</style>
</head>
<body>

<div id="loader"><div class="spin"></div><p>CARGANDO PORTAFOLIO…</p></div>

<header id="topbar"></header>

<main>
  <section class="hero" id="inicio">
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
    <div class="hero-grid"></div>
    <div class="hero-inner" id="heroContenido"></div>
    <div class="marquee"><div class="marquee-track" id="marqueeTrack"></div></div>
  </section>
  <div id="secciones"></div>
</main>

<footer id="contacto"><div id="footerContenido"></div></footer>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-box" role="dialog" aria-modal="true">
    <button class="close-btn" data-close aria-label="Cerrar">✕</button>
    <div class="media">
      <div class="slide-host" id="slideHost"></div>
      <button class="nav-arrow prev" id="btnPrev" aria-label="Anterior">‹</button>
      <button class="nav-arrow next" id="btnNext" aria-label="Siguiente">›</button>
      <div class="dots" id="dots"></div>
    </div>
    <div class="info" id="modalInfo"></div>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(s,c){return (c||document).querySelector(s);};
var $$=function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s));};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var DATA=null,SLIDES=[],slideIdx=0;

init();

async function init(){
  try{
    if(window.__PORTFOLIO__){DATA=window.__PORTFOLIO__;}
    else{
      var r=await fetch('data/portfolio.json',{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      DATA=await r.json();
    }
    DATA.site=DATA.site||{};DATA.areas=DATA.areas||[];DATA.trabajos=DATA.trabajos||[];
    construir();
    $('#loader').classList.add('fin');
    setTimeout(function(){$('#loader').remove();},700);
  }catch(err){
    $('#loader').innerHTML='<div class="error-carga"><h2>No se pudieron cargar los datos</h2>'+
      '<p>No se encontró <code>data/portfolio.json</code>.<br>Publica el archivo en el repositorio o sirve la carpeta con un servidor local para previsualizar.</p>'+
      '<p class="mono" style="margin-top:14px;font-size:.7rem">'+esc(err.message)+'</p></div>';
  }
}

function areaDe(id){for(var i=0;i<DATA.areas.length;i++){if(DATA.areas[i].id===id)return DATA.areas[i];}return null;}
function ordenTrabajos(a,b){return ((b.destacado?1:0)-(a.destacado?1:0))||((b.anio||0)-(a.anio||0));}

function construir(){
  document.title=(DATA.site.nombre||'Portafolio')+' — '+(DATA.site.claim||'Portafolio creativo');
  renderHeader();renderHero();renderSecciones();renderFooter();
  window.addEventListener('scroll',function(){$('#topbar').classList.toggle('scrolled',window.scrollY>10);},{passive:true});
  $('#secciones').addEventListener('click',function(e){var c=e.target.closest('.card');if(c)abrirModal(c.dataset.id);});
  $('#secciones').addEventListener('keydown',function(e){var c=e.target.closest('.card');if(c&&e.key==='Enter')abrirModal(c.dataset.id);});
  $('#btnPrev').addEventListener('click',function(){mostrarSlide(slideIdx-1);});
  $('#btnNext').addEventListener('click',function(){mostrarSlide(slideIdx+1);});
  $('#dots').addEventListener('click',function(e){var d=e.target.closest('.dot');if(d)mostrarSlide(+d.dataset.i);});
  $$('[data-close]').forEach(function(el){el.addEventListener('click',cerrarModal);});
  document.addEventListener('keydown',function(e){
    if(!$('#modal').classList.contains('open'))return;
    if(e.key==='Escape')cerrarModal();
    if(e.key==='ArrowLeft')mostrarSlide(slideIdx-1);
    if(e.key==='ArrowRight')mostrarSlide(slideIdx+1);
  });
  var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('visible');io.unobserve(en.target);}});},{threshold:.1});
  $$('.reveal').forEach(function(el){io.observe(el);});
}

function renderHeader(){
  var s=DATA.site;
  $('#topbar').innerHTML=
    '<a class="logo" href="#inicio"><svg viewBox="0 0 32 32" fill="none"><defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><path d="M16 3 29 26H3L16 3Z" stroke="url(#lg)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="16" cy="19" r="3.5" fill="url(#lg)"/></svg>'+esc(s.nombre||'Portafolio')+'</a>'+
    '<nav class="links">'+DATA.areas.map(function(a){return '<a href="#area-'+esc(a.id)+'">'+esc(a.corto||a.nombre)+'</a>';}).join('')+'<a href="#contacto">Contacto</a></nav>'+
    '<span class="count-chip">'+DATA.trabajos.length+' PROYECTOS</span>';
}

function renderHero(){
  var s=DATA.site,tr=DATA.trabajos;
  var clientes={};tr.forEach(function(t){if(t.cliente)clientes[t.cliente]=1;});
  var nClientes=Object.keys(clientes).length;
  var anios=tr.map(function(t){return t.anio;}).filter(Boolean);
  $('#heroContenido').innerHTML=
    '<div class="eyebrow reveal visible">'+esc(s.claim||'Portafolio creativo')+' · 3D · Diseño · Código</div>'+
    '<h1 class="reveal visible">'+esc(s.heroLinea1||'Ideas que se vuelven')+'<br><span class="grad">'+esc(s.heroLinea2||'forma, color y código')+'</span></h1>'+
    '<p class="lead reveal visible">'+esc(s.descripcion||'')+'</p>'+
    '<div class="hero-cta reveal visible">'+
      '<a class="btn" href="#area-'+esc((DATA.areas[0]&&DATA.areas[0].id)||'')+'">Ver proyectos →</a>'+
      '<a class="btn ghost" href="#contacto">Contactar</a></div>'+
    '<div class="stats reveal visible">'+
      '<div class="stat"><b>'+tr.length+'</b><span>proyectos publicados</span></div>'+
      '<div class="stat"><b>'+DATA.areas.length+'</b><span>áreas creativas</span></div>'+
      '<div class="stat"><b>'+nClientes+'</b><span>clientes y colaboraciones</span></div>'+
      (anios.length?'<div class="stat"><b>'+Math.min.apply(null,anios)+'–'+String(Math.max.apply(null,anios)).slice(2)+'</b><span>trayectoria</span></div>':'')+
    '</div>';
  var set={},palabras=[];
  tr.forEach(function(t){(t.herramientas||[]).forEach(function(h){set[h]=1;});});
  DATA.areas.forEach(function(a){set[a.nombre]=1;});
  Object.keys(set).forEach(function(k){palabras.push(k);});
  palabras=palabras.slice(0,14);
  var grupo=palabras.map(function(p){return '<span>'+esc(p)+' ✦</span>';}).join('');
  $('#marqueeTrack').innerHTML='<div class="mq-group">'+grupo+'</div><div class="mq-group">'+grupo+'</div>';
}

function cardHTML(t){
  var img=(t.imagenes&&t.imagenes[0])||'';
  var tools=(t.herramientas||[]).slice(0,3).map(function(h){return '<span class="tool">'+esc(h)+'</span>';}).join('');
  var tieneVideo=t.video&&t.video.tipo&&t.video.tipo!=='ninguno'&&t.video.url;
  return '<article class="card reveal '+(t.destacado?'featured':'')+'" data-id="'+esc(t.id)+'" tabindex="0" role="button" aria-label="Ver proyecto '+esc(t.titulo)+'">'+
    '<div class="card-img">'+(img?'<img loading="lazy" src="'+esc(img)+'" alt="'+esc(t.titulo)+'" onerror="this.style.display=\'none\'">':'')+
      '<span class="chip">'+(t.destacado?'★ DESTACADO':esc((areaDe(t.area)||{}).nombre||t.area))+'</span>'+
      (tieneVideo?'<span class="chip chip-video">▶ VIDEO</span>':'')+'</div>'+
    '<div class="card-body"><div class="card-top"><h3>'+esc(t.titulo)+'</h3><span class="anio">'+(t.anio||'')+'</span></div>'+
    (t.cliente?'<div class="cliente">'+esc(t.cliente)+'</div>':'')+
    (tools?'<div class="tools">'+tools+'</div>':'')+'</div></article>';
}

function renderSecciones(){
  $('#secciones').innerHTML=DATA.areas.map(function(a,i){
    var trabs=DATA.trabajos.filter(function(t){return t.area===a.id;}).sort(ordenTrabajos);
    return '<section class="area reveal" id="area-'+esc(a.id)+'" style="--ac:'+esc(a.color||'#a78bfa')+'">'+
      '<div class="area-head"><div>'+
        '<div class="area-num">ÁREA '+String(i+1).padStart(2,'0')+' // '+trabs.length+' PROYECTO'+(trabs.length===1?'':'S')+'</div>'+
        '<h2>'+esc(a.nombre)+'</h2><p>'+esc(a.descripcion||'')+'</p></div>'+
        '<a class="btn ghost" href="#contacto">Cotizar un proyecto →</a></div>'+
      '<div class="grid">'+(trabs.map(cardHTML).join('')||'<p class="muted">Aún no hay proyectos publicados en esta área.</p>')+'</div></section>';
  }).join('');
}

function renderFooter(){
  var s=DATA.site;
  $('#footerContenido').innerHTML=
    '<p class="eyebrow">Contacto</p>'+
    '<h2>¿Tienes un proyecto<br>en mente? <span class="grad">Hablemos.</span></h2>'+
    '<a class="email-link" href="mailto:'+esc(s.email||'')+'">'+esc(s.email||'')+'</a>'+
    '<div class="socials">'+(s.redes||[]).map(function(r){return '<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.nombre)+' ↗</a>';}).join('')+'</div>'+
    '<div class="small-print"><span>© '+new Date().getFullYear()+' '+esc(s.nombre||'')+'</span><span>SITIO ESTÁTICO · GITHUB PAGES · DATOS EN data/portfolio.json</span></div>';
}

/* ---------- Modal ---------- */
function ytId(u){var m=String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:u;}
function vimId(u){var m=String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/);return m?m[1]:u;}
function videoHTML(v){
  if(v.tipo==='youtube')return '<iframe src="https://www.youtube.com/embed/'+esc(ytId(v.url))+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
  if(v.tipo==='vimeo')return '<iframe src="https://player.vimeo.com/video/'+esc(vimId(v.url))+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
  return '<video src="'+esc(v.url)+'" controls playsinline></video>';
}
function abrirModal(id){
  var t=null;for(var i=0;i<DATA.trabajos.length;i++){if(DATA.trabajos[i].id===id)t=DATA.trabajos[i];}
  if(!t)return;
  SLIDES=[];
  if(t.video&&t.video.tipo&&t.video.tipo!=='ninguno'&&t.video.url)SLIDES.push({tipo:'video',video:t.video});
  (t.imagenes||[]).forEach(function(u){SLIDES.push({tipo:'img',url:u});});
  if(!SLIDES.length)SLIDES.push({tipo:'img',url:''});
  var area=areaDe(t.area)||{};
  $('#modalInfo').innerHTML=
    '<span class="chip" style="--ac:'+esc(area.color||'#a78bfa')+'">'+esc(area.nombre||'')+'</span>'+
    '<h3>'+esc(t.titulo)+'</h3>'+
    (t.descripcion?'<p class="desc">'+esc(t.descripcion)+'</p>':'')+
    ((t.cliente||t.anio)?'<dl class="kv">'+(t.cliente?'<dt>Cliente</dt><dd>'+esc(t.cliente)+'</dd>':'')+(t.anio?'<dt>Año</dt><dd>'+t.anio+'</dd>':'')+'</dl>':'')+
    ((t.herramientas||[]).length?'<div><div class="kv-label">Herramientas</div><div class="tools">'+t.herramientas.map(function(h){return '<span class="tool">'+esc(h)+'</span>';}).join('')+'</div></div>':'')+
    ((t.enlaces||[]).length?'<div class="enlaces">'+t.enlaces.map(function(e){return '<a class="btn ghost sm" href="'+esc(e.url)+'" target="_blank" rel="noopener">'+esc(e.texto||'Enlace')+' ↗</a>';}).join('')+'</div>':'');
  var muchos=SLIDES.length>1;
  $('#btnPrev').style.display=muchos?'':'none';
  $('#btnNext').style.display=muchos?'':'none';
  $('#dots').style.display=muchos?'':'none';
  mostrarSlide(0,true);
  $('#modal').classList.add('open');
  $('#modal').setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function mostrarSlide(i,instant){
  slideIdx=((i%SLIDES.length)+SLIDES.length)%SLIDES.length;
  var host=$('#slideHost');
  var pintar=function(){
    var s=SLIDES[slideIdx];
    host.innerHTML=s.tipo==='video'?videoHTML(s.video):(s.url?'<img src="'+esc(s.url)+'" alt="">':'<div class="sin-media">SIN IMAGEN</div>');
    host.style.opacity=1;
    $('#dots').innerHTML=SLIDES.map(function(_,k){return '<button class="dot'+(k===slideIdx?' active':'')+'" data-i="'+k+'" aria-label="Ir a '+(k+1)+'"></button>';}).join('');
  };
  if(instant){pintar();return;}
  host.style.opacity=0;setTimeout(pintar,180);
}
function cerrarModal(){
  $('#modal').classList.remove('open');
  $('#modal').setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  $('#slideHost').innerHTML='';
}
})();
</script>
</body>
