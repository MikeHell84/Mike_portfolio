<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="description" content="Portafolio creativo: 3D, Diseño Gráfico y Programación de Software y Web.">
<title>Estudio Prisma — Portafolio</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/400.css">
<style>
:root{
  --bg:#0b0b12; --panel:#141420; --text:#e8eaf2; --muted:#9aa0b5;
  --c3d:#22d3ee; --cgraf:#f472b6; --cdev:#a3e635; --violet:#a78bfa;
  --grad:linear-gradient(92deg,#22d3ee,#a78bfa 45%,#f472b6);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
::selection{background:#a78bfa;color:#0b0b12}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#26263a;border-radius:99px}
.mono{font-family:'JetBrains Mono',monospace}
.muted{color:var(--muted)}
section,footer{scroll-margin-top:80px}

/* ---------- Loader ---------- */
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;z-index:200;transition:opacity .5s}
#loader.fin{opacity:0;pointer-events:none}
#loader p{font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.3em;color:var(--muted)}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:#22d3ee;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.error-carga{text-align:center;max-width:460px;padding:0 22px;line-height:1.7;color:var(--muted)}
.error-carga h2{color:var(--text);margin-bottom:12px}
.error-carga code{background:#1a1a2a;border:1px solid #2a2a3f;padding:2px 7px;border-radius:6px;color:#22d3ee}

/* ---------- Header ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 5vw;transition:.3s;border-bottom:1px solid transparent}
header.scrolled{background:rgba(11,11,18,.78);backdrop-filter:blur(14px);border-bottom-color:rgba(255,255,255,.07)}
.logo{display:flex;gap:10px;align-items:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.02rem;letter-spacing:.02em;text-decoration:none;color:#fff;white-space:nowrap}
.logo svg,.logo img{width:26px;height:26px;flex:0 0 auto;border-radius:6px}
nav.links{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none}
nav.links::-webkit-scrollbar{display:none}
nav.links a{color:var(--muted);text-decoration:none;font-size:.88rem;font-weight:500;transition:.2s;white-space:nowrap}
nav.links a:hover{color:#fff}
.count-chip{font-family:'JetBrains Mono',monospace;font-size:.7rem;border:1px solid rgba(255,255,255,.15);padding:6px 12px;border-radius:99px;color:var(--muted);white-space:nowrap}
@media(max-width:860px){nav.links{display:none}}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}
#bgFormas{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bgFormas .orb{position:absolute;border-radius:50%;animation:orbFloat var(--fv,14s) ease-in-out infinite alternate}
@keyframes orbFloat{to{transform:translate(40px,-30px) scale(1.08)}}
#bgFormas .p1{position:absolute;border-radius:50%;animation:orbFloat var(--fv,16s) ease-in-out infinite alternate}
.onda-track{position:absolute;left:0;bottom:-2px;width:200%;display:flex;animation:ondaX var(--fv,18s) linear infinite}
.ondaA{width:50%}
.ondaA svg{display:block;width:100%;height:190px}
@keyframes ondaX{to{transform:translateX(-50%)}}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 75%)}
#bgParallax{position:fixed;top:-30%;bottom:-30%;left:0;right:0;z-index:-1;background-repeat:no-repeat;background-size:cover;pointer-events:none;will-change:transform}
#bgFondoWrap{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
#bgFondoImage{position:absolute;inset:0;background-repeat:no-repeat;background-size:cover;background-position:center}
#bgFondoOsc{position:absolute;inset:0}
.hero-inner{margin:auto 0;padding:150px 5vw 70px;position:relative;z-index:2}
.eyebrow{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.35em;font-size:.72rem;color:var(--muted);margin-bottom:22px}
.hero h1{font-size:clamp(2.7rem,8.2vw,6.6rem);line-height:1.02;letter-spacing:-.03em;font-weight:700}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:54ch;color:var(--lead-color, var(--muted));font-size:1.08rem;margin-top:26px;line-height:1.75}
.hero-cta{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--grad);color:#0b0b12;border:0;padding:13px 24px;border-radius:12px;font-weight:600;font-size:.94rem;text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .2s;font-family:'Inter',sans-serif}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(167,139,250,.55)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.18)}
.btn.ghost:hover{border-color:rgba(255,255,255,.4);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:.82rem;border-radius:9px}
.stats{display:flex;gap:clamp(26px,6vw,80px);margin-top:64px;flex-wrap:wrap}
.stat b{font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700}
.stat span{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}
.marquee{border-block:1px solid rgba(255,255,255,.08);overflow:hidden;padding:15px 0;background:rgba(255,255,255,.02);position:relative;z-index:2}
.marquee-track{display:flex;width:max-content;animation:mq 30s linear infinite}
.mq-group{display:flex;gap:48px;padding-right:48px}
.mq-group span{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted);white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- Secciones por área ---------- */
section.area{padding:110px 5vw;border-top:1px solid rgba(255,255,255,.06);position:relative}
section.area::before{content:'';position:absolute;top:0;left:0;right:0;height:340px;background:radial-gradient(600px 220px at 12% 0%,color-mix(in srgb,var(--ac) 12%,transparent),transparent 70%);pointer-events:none}
.area-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:52px;flex-wrap:wrap;position:relative}
.area-num{font-family:'JetBrains Mono',monospace;color:var(--ac);font-size:.74rem;letter-spacing:.3em;margin-bottom:14px}
.area-head h2{font-size:clamp(2rem,4.6vw,3.4rem);letter-spacing:-.02em}
.area-head p{color:var(--muted);max-width:48ch;margin-top:12px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--p-mincol,300px),1fr));gap:var(--p-gap,26px)}
.card{position:relative;border-radius:var(--p-radius,18px);overflow:hidden;background:var(--pc-bg,var(--panel));border:1px solid var(--pc-border,rgba(255,255,255,.07));cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.card:hover{transform:translateY(-6px);box-shadow:0 26px 50px -22px rgba(0,0,0,.7);border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.card:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
@media(min-width:720px){.card.featured{grid-column:span 2}.card.featured .card-img{aspect-ratio:16/8}}
.card-img{aspect-ratio:4/3;overflow:hidden;position:relative;background:#0d0d16}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .card-img img{transform:scale(1.06)}
.card-img::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,var(--pc-overlay,rgba(10,10,16,.85)))}
.card-zoom{position:absolute;bottom:14px;right:14px;z-index:2;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:rgba(10,10,16,.7);backdrop-filter:blur(8px);color:var(--text);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);opacity:0;transform:scale(.8) translateY(8px);transition:opacity .2s,transform .2s;cursor:pointer}
.card:hover .card-zoom,.card:focus-within .card-zoom{opacity:1;transform:scale(1) translateY(0)}
.card-zoom:hover,.card-zoom:focus-visible{background:rgba(30,30,50,.9)}
.chip{position:absolute;top:14px;left:14px;z-index:2;font-family:'JetBrains Mono',monospace;font-size:.66rem;padding:6px 11px;border-radius:99px;background:var(--pc-chip,rgba(10,10,16,.6));backdrop-filter:blur(8px);color:var(--pc-chipText,var(--ac));border:1px solid color-mix(in srgb,var(--ac) 40%,transparent)}
/* Formatos de presentación */
.formato-grid{}.formato-grid .grid{grid-template-columns:repeat(auto-fill,minmax(var(--p-mincol,300px),1fr))}
.formato-masonry .grid{display:block;columns:3;column-gap:var(--p-gap,26px)}
.formato-masonry .grid>*{display:inline-block;width:100%;margin-bottom:var(--p-gap,26px);break-inside:avoid;vertical-align:top}
.formato-masonry .card:nth-child(3n+2) .card-img{aspect-ratio:4/5}
.formato-masonry .card:nth-child(3n) .card-img{aspect-ratio:1/1}
@media(max-width:900px){.formato-masonry .grid{columns:2}}
@media(max-width:560px){.formato-masonry .grid{columns:1}}
.formato-list .grid{display:block}
.formato-list .card{display:flex;align-items:stretch;gap:24px;margin-bottom:22px}
.formato-list .card .card-img{width:38%;flex-shrink:0;aspect-ratio:auto;min-height:190px}
.formato-list .card .card-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 4px 20px 0}
.formato-list .card-top h3{font-size:1.45rem}
@media(max-width:720px){.formato-list .card{flex-direction:column}.formato-list .card .card-img{width:100%;aspect-ratio:4/3;min-height:0}}
.formato-comic .grid{grid-template-columns:repeat(auto-fill,minmax(var(--p-mincol,280px),1fr));gap:calc(var(--p-gap,26px) + 6px) var(--p-gap,26px);padding:4px 2px;background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.3px);background-size:18px 18px}
.formato-comic .card{--tilt:0deg;border-radius:5px;border:3px solid var(--pc-border,#151a2e);background:var(--pc-bg,#f6efe1);transform:rotate(var(--tilt));box-shadow:var(--p-shadow,8px) var(--p-shadow,8px) 0 var(--pc-shadow,rgba(7,9,18,.85))}
.formato-comic .card:nth-child(even){--tilt:calc(var(--p-tilt,1.2deg) * 1)}
.formato-comic .card:nth-child(odd){--tilt:calc(var(--p-tilt,1.2deg) * -1)}
.formato-comic .card:hover{transform:rotate(0) translateY(-7px);box-shadow:0 0 0 3px var(--ac),calc(var(--p-shadow,8px) + 4px) calc(var(--p-shadow,8px) + 5px) 0 var(--pc-shadow,rgba(7,9,18,.85))}
.formato-comic .card.featured{--tilt:calc(var(--p-tilt,1.2deg) * -1.333);border-width:4px;box-shadow:calc(var(--p-shadow,8px) + 3px) calc(var(--p-shadow,8px) + 3px) 0 var(--pc-shadow,var(--ac))}
.formato-comic .card .card-img{border-radius:2px 2px 0 0;border-bottom:3px solid var(--pc-border,#151a2e)}
.formato-comic .card-img::after{background:linear-gradient(180deg,transparent 62%,var(--pc-overlay,rgba(21,26,46,.55)))}
.formato-comic .card-body{padding:14px 15px 15px;color:var(--pc-text,#171b30)}
.formato-comic .card-top h3{text-transform:uppercase;letter-spacing:.02em;color:var(--pc-text,#10142a);font-size:1.06rem}
.formato-comic .anio{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:.72rem;color:var(--pc-anioText,#f6c53f);background:var(--pc-anioBg,#151a2e);border-radius:3px;padding:3px 9px}
.formato-comic .cliente{color:var(--pc-muted,#5b5f79)}
.formato-comic .tools .tool{background:var(--pc-toolBg,#151a2e);color:var(--pc-toolText,#f3f0ff);border:0;border-radius:3px;font-weight:600}
.formato-comic .chip{top:10px;left:10px;font-family:'Space Grotesk',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:.68rem;color:var(--pc-chipText,#151a2e);background:var(--pc-chip,#f6c53f);border:2px solid var(--pc-border,#151a2e);border-radius:2px;box-shadow:3px 3px 0 var(--pc-border,#151a2e);backdrop-filter:none}
.formato-comic .chip-video{left:auto;right:10px;background:var(--pc-videoBg,#ff4d4d);color:var(--pc-videoText,#fff);border-color:var(--pc-border,#151a2e)}
@media(max-width:720px){.formato-comic .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px 18px}.formato-comic .card,.formato-comic .card.featured{--tilt:0deg}}
.chip-video{left:auto;right:14px;color:var(--pc-videoText,#fff);border-color:var(--pc-border,rgba(255,255,255,.25))}
.card-body{padding:18px 20px 20px;color:var(--pc-text,var(--text))}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card-top h3{font-size:1.14rem;letter-spacing:-.01em}
.anio{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--pc-muted,var(--muted))}
.cliente{color:var(--pc-muted,var(--muted));font-size:.82rem;margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tool{font-size:.72rem;font-family:'JetBrains Mono',monospace;padding:5px 10px;border-radius:8px;background:var(--pc-toolBg,rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.09);color:var(--pc-toolText,#cfd3e2)}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:4vh 4vw}
.modal.open{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(5,5,10,.82);backdrop-filter:blur(10px)}
.modal-box{position:relative;width:min(1100px,100%);max-height:92vh;overflow:hidden;background:#101018;border:1px solid rgba(255,255,255,.1);border-radius:20px;display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:minmax(0,1fr)}
@media(max-width:880px){.modal-box{grid-template-columns:1fr}}
.close-btn{position:absolute;top:14px;right:14px;z-index:20;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(10,10,16,.6);color:#fff;font-size:1rem;cursor:pointer;backdrop-filter:blur(6px)}
.media{position:relative;background:#000;min-width:0;min-height:280px;max-height:92vh;overflow:hidden}
.slide-host{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .18s}
.slide-host img{max-width:100%;max-height:100%;object-fit:contain}
.slide-host iframe,.slide-host video{width:100%;height:100%;border:0}
.sin-media{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.8rem}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(10,10,16,.55);color:#fff;font-size:1rem;cursor:pointer;backdrop-filter:blur(6px);transition:.2s}
.nav-arrow:hover{background:rgba(30,30,50,.8)}
.nav-arrow.prev{left:14px}.nav-arrow.next{right:14px}
.modal-zoom{position:absolute;top:14px;right:14px;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(10,10,16,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);transition:.2s}
.modal-zoom:hover{background:rgba(30,30,50,.8)}
.modal .zoomed{width:100%;height:100%;object-fit:contain;display:block}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5}
.dot{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.35);border:0;cursor:pointer;transition:.25s;padding:0}
.dot.active{background:#fff;width:22px}
.info{padding:30px;display:flex;flex-direction:column;gap:16px;min-width:0;overflow-y:auto;max-height:92vh}
.info .chip{position:static;display:inline-block;width:fit-content}
.info h3{font-size:1.7rem;letter-spacing:-.02em}
.desc{color:var(--muted);line-height:1.7;font-size:.95rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:.88rem}
.kv dt{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;padding-top:3px}
.kv-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.enlaces{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Before / After ---------- */
.ba-wrap{position:relative;width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.12);user-select:none;touch-action:none;background:#000}
.ba-img{position:absolute;inset:0}
.ba-img img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ba-before{clip-path:inset(0 50% 0 0);z-index:2}
.ba-clip{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;transform:translateX(-1px);z-index:3;box-shadow:0 0 12px rgba(0,0,0,.6)}
.ba-handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;border:0;cursor:ew-resize;z-index:4;display:flex;align-items:center;justify-content:center;gap:6px;color:#111;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.ba-handle .ba-caret{font-size:1rem;line-height:1;font-weight:700}
.ba-wrap.dragging{cursor:ew-resize}
.ba-tag{position:absolute;top:12px;z-index:4;font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.14em;padding:4px 8px;border-radius:6px;background:rgba(10,10,16,.7);color:#fff;backdrop-filter:blur(4px)}
.ba-tag-before{left:12px}
.ba-tag-after{right:12px}

/* ---------- Sección Antes / Después ---------- */
.ba-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:var(--p-gap,26px)}
.ba-item{border-radius:var(--p-radius,18px);overflow:hidden;background:var(--pc-bg,var(--panel));border:1px solid var(--pc-border,rgba(255,255,255,.07));padding:14px}
.ba-item-title{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;letter-spacing:-.01em;margin:10px 4px 4px;color:var(--text)}
.ba-item-desc{color:var(--muted);font-size:.88rem;line-height:1.6;margin:0 4px 4px}

/* ---------- Footer ---------- */
footer{border-top:1px solid rgba(255,255,255,.08);padding:120px 5vw 40px;position:relative;overflow:hidden}
footer::before{content:'';position:absolute;bottom:-200px;left:20%;width:600px;height:400px;background:radial-gradient(closest-side,rgba(167,139,250,.18),transparent);pointer-events:none}
footer h2{font-size:clamp(2rem,5.4vw,4.2rem);letter-spacing:-.03em;line-height:1.1;margin:18px 0 30px}
.email-link{display:inline-block;font-family:'Space Grotesk',sans-serif;font-size:clamp(1.1rem,3vw,1.9rem);color:#fff;text-decoration:none;border-bottom:2px solid transparent;background:linear-gradient(var(--grad),var(--grad)) no-repeat 0 100%/0% 2px;transition:background-size .4s;padding-bottom:4px}
.email-link:hover{background-size:100% 2px}
.contact-info{display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;color:var(--muted);font-size:.9rem}
.contact-info a{color:var(--muted);text-decoration:none;transition:.2s}
.contact-info a:hover{color:#fff}
.socials{display:flex;gap:20px;margin-top:34px;flex-wrap:wrap}
.socials a{color:var(--muted);text-decoration:none;font-size:.9rem;transition:.2s}
.socials a:hover{color:#fff}

.tray-content{padding-top:6px;background:var(--tray-card-bg,rgba(255,255,255,.035));border:1px solid var(--tray-card-border,rgba(255,255,255,.1));border-radius:var(--tray-radius,18px);padding:22px 24px;position:relative;transition:.35s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(8px)}
.tray-content::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,var(--tray-accent2,#22d3ee),transparent 35%,transparent 65%,var(--tray-accent,#a78bfa));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.5;pointer-events:none}
.tray-card:hover .tray-content{transform:translateY(-3px);border-color:color-mix(in srgb,var(--tray-accent,#a78bfa) 55%,transparent);box-shadow:0 18px 40px -18px color-mix(in srgb,var(--tray-accent,#a78bfa) 50%,transparent)}
.tray-card.featured .tray-content{border-color:color-mix(in srgb,var(--tray-accent,#a78bfa) 60%,transparent);box-shadow:0 0 0 1px var(--tray-accent,#a78bfa),0 14px 44px -14px color-mix(in srgb,var(--tray-accent,#a78bfa) 65%,transparent)}
.tray-type{display:flex;align-items:center;gap:6px}
.tray-label{color:#0b0b12;font-size:.68rem;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.12em;font-weight:700;padding:5px 13px;border-radius:99px;background:linear-gradient(135deg,var(--tray-accent2,#22d3ee),var(--tray-accent,#a78bfa));white-space:nowrap}
.tray-date{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted);white-space:nowrap;background:rgba(255,255,255,.05);padding:4px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.1)}

.tray-card.featured .tray-title{background:linear-gradient(92deg,var(--tray-accent2,#22d3ee),var(--tray-accent,#a78bfa));-webkit-background-clip:text;background-clip:text;color:transparent}
.tray-org{color:var(--muted);font-size:.88rem;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.tray-org::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--tray-accent,#a78bfa);box-shadow:0 0 8px var(--tray-accent,#a78bfa)}
.tray-desc{color:var(--text);line-height:1.75;font-size:.9rem;margin-bottom:12px}

.tray-tag{font-size:.66rem;font-family:'JetBrains Mono',monospace;padding:4px 11px;border-radius:6px;background:color-mix(in srgb,var(--tray-accent,#a78bfa) 14%,transparent);border:1px solid color-mix(in srgb,var(--tray-accent,#a78bfa) 30%,transparent);color:var(--text)}
.tray-footer{margin-top:16px;padding-top:14px;border-top:1px dashed rgba(255,255,255,.12)}
.tray-link{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-family:'JetBrains Mono',monospace;color:var(--tray-accent2,#22d3ee);text-decoration:none;transition:.2s}
.tray-link:hover{color:var(--tray-accent,#a78bfa);gap:11px}
.tray-media{grid-row:1/3;justify-self:center;align-self:center}

@media(max-width:720px){
  .tray-card{grid-template-columns:1fr;padding-left:54px;padding-right:6px;gap:14px}
  .tray-marker{position:absolute;left:4px;top:10px}
  .tray-marker .tray-badge{width:40px;height:40px;font-size:.9rem}
  .tray-timeline::before{left:24px}
  .tray-content{padding:18px}
}
.tray-empty{padding:40px 20px;color:var(--muted);font-size:.85rem;text-align:center}

/* ---------- Reveal ---------- */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
.reveal.visible{opacity:1;transform:none}

<script>
(function(){
'use strict';
var $=function(s,c){return (c||document).querySelector(s);};
var $$=function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s));};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var DATA=null,SLIDES=[],slideIdx=0;
var FUENTES={
  titulos:{'Space Grotesk':'Space+Grotesk:wght@500;700','Poppins':'Poppins:wght@500;700','Montserrat':'Montserrat:wght@500;700','Playfair Display':'Playfair+Display:wght@500;700','Sora':'Sora:wght@500;700','Outfit':'Outfit:wght@500;700'},
  texto:{'Inter':'Inter:wght@400;500;600','Poppins':'Poppins:wght@400;500;600','Open Sans':'Open+Sans:wght@400;500;600','Roboto':'Roboto:wght@400;500;600','Work Sans':'Work+Sans:wght@400;500;600','Source Sans 3':'Source+Sans+3:wght@400;500;600'},
  mono:{'JetBrains Mono':'JetBrains+Mono:wght@400','Fira Code':'Fira+Code:wght@400','IBM Plex Mono':'IBM+Plex+Mono:wght@400','Space Mono':'Space+Mono:wght@400'}
};
var FONT_BASE={'Space Grotesk':1,'Inter':1,'JetBrains Mono':1};

init();

function cargarFuente(cat,nombre){
  if(FONT_BASE[nombre]||!nombre)return;
  var q=FUENTES[cat]&&FUENTES[cat][nombre];
  if(!q)return;
  var id='fnt-'+cat;
  if(document.getElementById(id))return;
  var l=document.createElement('link');l.id=id;l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family='+q+'&display=swap';
  document.head.appendChild(l);
}

function aplicarDiseno(d){
  d=d||{};
  var fuT=d.fuenteTitulos||'Space Grotesk',fuB=d.fuenteTexto||'Inter',fuM=d.fuenteMono||'JetBrains Mono';
  cargarFuente('titulos',fuT);cargarFuente('texto',fuB);cargarFuente('mono',fuM);
  var gF=d.gradfrom||'#22d3ee',gM=d.gradmid||'#a78bfa',gT=d.gradto||'#f472b6';
  var p=d.presentacion||{},pv=function(v,def){return v==null?def:v;};
  var pc='',pm={bg:'--pc-bg',border:'--pc-border',text:'--pc-text',muted:'--pc-muted',overlay:'--pc-overlay',chip:'--pc-chip',chipText:'--pc-chipText',anioBg:'--pc-anioBg',anioText:'--pc-anioText',toolBg:'--pc-toolBg',toolText:'--pc-toolText',videoBg:'--pc-videoBg',videoText:'--pc-videoText',shadow:'--pc-shadow'};
  var col=p.colores||{};
  for(var cn in pm){if(col[cn])pc+=pm[cn]+':'+col[cn]+';';}
  var tray=d.trayectoria||{},trs='';
  trs+='--tray-accent:'+(tray.accent||'#a78bfa')+';';
  trs+='--tray-accent2:'+(tray.accent2||'#22d3ee')+';';
  trs+='--tray-accent3:'+(tray.accent3||'#f472b6')+';';
  trs+='--tray-card-bg:'+(tray.cardBg||'rgba(255,255,255,.035)')+';';
  trs+='--tray-card-border:'+(tray.cardBorder||'rgba(255,255,255,.1)')+';';
  trs+='--tray-radius:'+(tray.radius!=null?tray.radius:18)+'px;';
  var trayFont=tray.fontTitle||fuT;
  trs+='--tray-font-title:'+(trayFont.indexOf(' ')>=0?"'"+trayFont+"'":trayFont)+';';
  var css=':root{'
    +'--bg:'+(d.bg||'#0b0b12')+';'
    +'--panel:'+(d.panel||'#141420')+';'
    +'--text:'+(d.texto||'#e8eaf2')+';'
    +'--muted:'+(d.muted||'#9aa0b5')+';'
    +trs
    +'--p-gap:'+pv(p.gap,26)+'px;'
    +'--p-mincol:'+pv(p.mincol,300)+'px;'
    +'--p-radius:'+pv(p.radius,18)+'px;'
    +'--p-tilt:'+pv(p.tilt,1.2)+'deg;'
    +'--p-shadow:'+pv(p.shadow,8)+'px;'
    +pc
    +'--grad:linear-gradient(92deg,'+gF+','+gM+' 46%,'+gT+');'
    +"--lead-color:"+(d.lead||d.muted||'#9aa0b5')+';}'
    +'body{font-family:\''+fuB+'\',system-ui,sans-serif}'
    +'h1,h2,h3{font-family:\''+fuT+'\',sans-serif}'
    +'.logo{font-family:\''+fuT+'\',sans-serif}'
    +'.mono{font-family:\''+fuM+'\',monospace}'
    +(d.css||'');
  var st=document.getElementById('diseno-dinamico');
  if(!st){st=document.createElement('style');st.id='diseno-dinamico';document.head.appendChild(st);}
  st.textContent=css;
  // ---- generar reglas para estilos de botones personalizados ----
  try{
    var bs = d.buttonStyles || {};
    var extra = '';
    var needsKeyframes = false;
    for(var k in bs){
      try{
        var s = bs[k] || {};
        var sel = '[data-style="'+k.replace(/"/g,'"')+'"]';
        var bg = s.bgColor ? s.bgColor : '';
        var txt = s.textColor ? s.textColor : '';
        var pad = (s.padding != null) ? (s.padding+'px') : '13px';
        var br = (s.borderRadius != null) ? (s.borderRadius+'px') : '12px';
        var fw = s.fontWeight || '600';
        var icon = s.icon || '';
        var trans = (s.transitionMs!=null) ? (Number(s.transitionMs)||200) : 200;
        var hoverScale = (s.hoverScale!=null) ? (Number(s.hoverScale)||1) : 1;
        var anim = s.animation || 'none';
        var iconPos = s.iconPosition === 'right' ? 'after' : 'before';
        extra += '.btn'+sel+'{';
        if(bg) extra += 'background:'+bg+';';
        extra += 'color:'+(txt||'#0b0b12')+';';
        extra += 'padding:'+pad+' 24px;';
        extra += 'border-radius:'+br+';font-weight:'+fw+';';
        extra += 'transition:transform '+trans+'ms,box-shadow '+trans+'ms,background-color '+trans+'ms;';
        if(s.disabled){ extra += 'opacity:.6;pointer-events:none;'; }
        extra += '}';
        // ghost variant
        extra += '.btn.ghost'+sel+'{background:transparent;border:1px solid rgba(255,255,255,.18);color:'+(txt||'var(--text)')+';}';
        // hover: scale, colors, transitions
        var hoverBg = s.hoverBgColor || bg;
        var hoverTxt = s.hoverTextColor || txt;
        var hoverProps = '';
        if(hoverBg) hoverProps += 'background:'+hoverBg+';';
        if(hoverTxt) hoverProps += 'color:'+hoverTxt+';';
        if(hoverScale && hoverScale!=1) hoverProps += 'transform:scale('+hoverScale+');';
        if(hoverProps){ extra += '.btn'+sel+':hover{'+hoverProps+'}'; }
        // animation
        if(anim && anim!=='none'){
          needsKeyframes = true;
          if(anim==='pulse') extra += '.btn'+sel+'{animation:adm-btn-pulse 1600ms infinite;animation-timing-function:ease-in-out;}';
          else if(anim==='float') extra += '.btn'+sel+'{animation:adm-btn-float 3200ms infinite;animation-timing-function:linear;}';
        }
        if(icon){
          var pseudo = iconPos==='after' ? ':after' : ':before';
          var mr = iconPos==='after' ? 'margin-left:8px;' : 'margin-right:8px;';
          extra += '.btn'+sel+pseudo+'{content:"";display:inline-block;width:20px;height:20px;'+mr+'vertical-align:middle;background-image:url("'+icon.replace(/\"/g,'\"')+'");background-size:20px 20px;background-repeat:no-repeat;border-radius:4px;}';
        }
      }catch(e){/* ignore per-style errors */}
    }
    if(needsKeyframes){
      extra = '@keyframes adm-btn-pulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}@keyframes adm-btn-float{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}' + extra;
    }
    st.textContent = st.textContent + extra;
    // apply DOM-level behavior and labels for styles that define them
    try{
      Object.keys(bs).forEach(function(k){
        try{
          var s = bs[k] || {};
          var selector = '.btn[data-style="'+k.replace(/\"/g,'\"')+'"]';
          var els = Array.prototype.slice.call(document.querySelectorAll(selector));
          els.forEach(function(el){
            // label: only replace if no complex children
            if(s.label){
              var hasMedia = el.querySelector('img,svg');
              if(!hasMedia){ el.textContent = s.label; }

            // behavior: link / mailto
            if(s.behavior && s.behavior.type){
              if(s.behavior.type === 'link' && s.behavior.url){

  aplicarParallax(d.parallax);

function aplicarFormas(f,gF,gM,gT){
  f=f||{};
  var host=document.getElementById('bgFormas');
  if(!host)return;
  var pal=[gF,gM,gT];
  var tipo=f.tipo||'orbes',op=(f.opacidad==null?45:f.opacidad)/100,dur=(f.velocidad||14)+'s';
  var n=Math.min(12,Math.max(1,f.cantidad||3));
  var html='';
  if(f.activo===false){host.innerHTML='';return;}
  if(tipo==='orbes'){
    var plant=[
      {t:-140,l:-120,w:480},{t:'auto',b:10,l:'auto',r:-140,w:420},{t:'30%',l:'55%',w:300},
      {t:45,l:5,w:260},{t:20,l:'38%',w:340},{t:'auto',b:25,r:'18%',w:240},
      {t:55,l:12,w:200},{t:5,l:'70%',w:360},{t:40,l:'85%',w:280}
    ];
    for(var i=0;i<n;i++){
      var o=plant[i%plant.length];
      var pos='top:'+o.t+';'+((o.l!=null)?'left:'+o.l+';':'')+((o.r!=null)?'right:'+o.r+';':'')+((o.b!=null)?'bottom:'+o.b+';':''); 
      if(i>=plant.length)pos='top:'+(10+i*9)%80+'%;left:'+(i*23)%90+'%;';
      html+='<div class="orb" style="'+pos+'width:'+o.w+'px;height:'+o.w+'px;background:'+pal[i%3]+';opacity:'+op+';filter:blur('+(f.blur==null?90:f.blur)+'px);animation-duration:'+dur+';animation-delay:-'+(i*4)+'s"></div>';
    }
  }else if(tipo==='ondas'){
    var op2=Math.max(.06,op*.45);
    var svg=function(ph,c,o){
      return '<svg viewBox="0 0 2400 320" preserveAspectRatio="none"><path d="'+ph+'" fill="'+c+'" opacity="'+o+'"/></svg>';
    };
    var p1='M0,170 C240,300 480,40 720,170 C960,300 1200,40 1440,170 C1680,300 1920,40 2160,170 C2280,260 2360,120 2400,170 L2400,320 L0,320 Z';
    var p2='M0,200 C260,80 520,320 780,200 C1040,80 1300,320 1560,200 C1820,80 2080,320 2340,200 L2400,200 L2400,320 L0,320 Z';
    html='<div class="onda-track" style="--fv:'+dur+'">'
      +'<div class="ondaA">'+svg(p1,pal[0],op2)+'</div>'
      +'<div class="ondaA">'+svg(p1,pal[0],op2)+'</div></div>'
      +'<div class="onda-track" style="--fv:'+(f.velocidad*1.6||22)+'s;opacity:.6">'
      +'<div class="ondaA">'+svg(p2,pal[1],op2)+'</div>'
      +'<div class="ondaA">'+svg(p2,pal[1],op2)+'</div></div>';
  }else if(tipo==='particulas'){
    for(var i=0;i<n*4;i++){
      var s=4+Math.random()*8;
      html+='<div class="p1" style="top:'+(8+Math.random()*80)+'%;left:'+(2+Math.random()*94)+'%;width:'+s+'px;height:'+s+'px;background:'+pal[i%3]+';opacity:'+Math.min(1,op*1.6)+';animation-duration:'+(f.velocidad+Math.random()*6||14)+'s;animation-delay:-'+(i*2)+'s"></div>';
    }
  }else{ /* cuadricula */
    html='<div class="hero-grid"></div>';
  }
  host.innerHTML=html;
}

function aplicarParallax(p){
  p=p||{};
  var old=document.getElementById('bgParallax');
  if(old){old.parentNode.removeChild(old);}
  if(!p.activo||!p.imagen)return;
  var url=String(p.imagen).replace(/["'()\\]/g,'');
  var pos=p.posicion==='izq'?'0% 50%':(p.posicion==='der'?'100% 50%':'50% 50%');
  var d=document.createElement('div');
  d.id='bgParallax';
  d.style.cssText='background-image:url(\''+url+'\');background-position:'+pos+';opacity:'+((p.opacidad==null?25:p.opacidad)/100)+';filter:blur('+(p.desenfoque||0)+'px)';
  document.body.appendChild(d);
}

function aplicarFondo(f){
  var old=document.getElementById('bgFondoWrap');
  if(old){old.parentNode.removeChild(old);}
  f=f||{};
  if(!f.activo||!f.imagen)return;
  var url=String(f.imagen).replace(/["'()\\]/g,'');
  var pos=f.posicion==='arriba'?'center top':(f.posicion==='abajo'?'center bottom':'center');
  var w=document.createElement('div');w.id='bgFondoWrap';
  var img=document.createElement('div');img.id='bgFondoImage';
  img.style.cssText='background-image:url(\''+url+'\');background-position:'+pos+';opacity:'+((f.opacidad==null?40:f.opacidad)/100)+';filter:blur('+(f.desenfoque||0)+'px)';
  var osc=document.createElement('div');osc.id='bgFondoOsc';
  osc.style.background='rgba(0,0,0,'+((f.oscurecer==null?0:f.oscurecer)/100)+')';
  w.appendChild(img);w.appendChild(osc);
  document.body.appendChild(w);
}

async function init(){
  try{
    if(window.__PORTFOLIO__){DATA=window.__PORTFOLIO__;}
    else{
      var ls=null;
      try{
        var r=await fetch('data/portfolio.json?v='+Date.now(),{cache:'no-store'});
        if(!r.ok)throw new Error('HTTP '+r.status);
        DATA=await r.json();
      }catch(e){
        try{if(typeof localStorage!=='undefined')ls=localStorage.getItem('pa_state_v1');}catch(le){ls=null;}
        if(ls){
          try{var obj=JSON.parse(ls);if(obj&&obj.site&&obj.areas)DATA=obj;else throw new Error('respaldo no válido');}
          catch(pe2){throw e;}
        }
        else{throw e;}
      }
    }
    DATA.site=DATA.site||{};DATA.areas=DATA.areas||[];DATA.trabajos=DATA.trabajos||[];
    aplicarDiseno(DATA.diseno);
    construir();
    $('#loader').classList.add('fin');
    setTimeout(function(){$('#loader').remove();},700);
  }catch(err){
    $('#loader').innerHTML='<div class="error-carga"><h2>No se pudieron cargar los datos</h2>'+

      '<p class="mono" style="margin-top:14px;font-size:.7rem">'+esc(err.message)+'</p></div>';
  }
}

function renderTrayectoria(){
  var tra=DATA.trayectoria||[];
  if(!tra.length)return;
  var traOrden=tra.slice().sort(function(a,b){
    var da=Date.parse((a.fin||a.inicio||'').replace('/','-')+'/01')||0;
    var db=Date.parse((b.fin||b.inicio||'').replace('/','-')+'/01')||0;
    return db-da;
  });
  var types={'trabajo':{label:'Trabajo'},'proyecto':{label:'Proyecto'},
    'formacion':{label:'Formación'},'experiencia':{label:'Experiencia'},'logro':{label:'Logro'}};
  // Solo mostrar filtros para tipos que tengan entradas reales
  var tiposConDatos=Object.keys(types).filter(function(k){return traOrden.some(function(t){return t.tipo===k;})});
  var html='<section class="area reveal" id="area-trayectoria" style="--ac:#a78bfa">'+
    '<div class="area-head"><div>'+

    '<h2>Mi Trayectoria</h2>'+

    '</div></div>'+
    '<div class="tray-timeline" id="trayTimeline"></div></section>';

  sec.innerHTML=html;
  var tsec=sec.firstElementChild;
  $('#secciones').appendChild(tsec);
  var timeline=document.getElementById('trayTimeline');
  function renderFiltered(filter){
    var list=filter==='todos'?traOrden:traOrden.filter(function(t){return t.tipo===filter;});
    if(!list.length){timeline.innerHTML='<div class="tray-empty">No hay entradas para este filtro.</div>';return;}
    timeline.innerHTML=list.map(function(t,i){
      var ty=types[t.tipo]||{label:t.tipo};
      var fecha=formatFechaTray(t.inicio,t.fin);
      var img=t.imagen?'<img class="tray-img" src="'+esc(t.imagen)+'" alt="" loading="lazy">':'';
      var enlace=t.enlace?'<a class="tray-link" href="'+esc(t.enlace)+'" target="_blank" rel="noopener">Ver más <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/></svg></a>':'';
      return '<article class="tray-card reveal '+(t.destacado?'featured':'')+'" data-tipo="'+esc(t.tipo)+'" style="--delay:'+(i*80)+'ms">'+
        '<div class="tray-marker"><div class="tray-badge">'+String(i+1).padStart(2,'0')+'</div></div>'+
        '<div class="tray-content">'+
        '<div class="tray-title-row">'+
        '<h3 class="tray-title">'+esc(t.titulo||'Sin título')+'</h3>'+
        '<div class="tray-meta">'+
        '<span class="tray-date">'+formatFechaTray(t.inicio,t.fin)+'</span>'+
        '<span class="tray-label">'+(types[t.tipo]?types[t.tipo].label:t.tipo)+'</span>'+
        '</div>'+
        '</div>'+
        '<p class="tray-org">'+esc(t.org||'')+'</p>'+
        (t.descripcion?'<p class="tray-desc">'+esc(t.descripcion)+'</p>':'')+
        (t.tags&&t.tags.length?'<div class="tray-tags">'+t.tags.slice(0,6).map(function(tag){return '<span class="tray-tag">'+esc(tag)+'</span>';}).join('')+'</div>':'')+
        (enlace?'<div class="tray-footer">'+enlace+'</div>':'')+
        '</div>'+
        (img?'<div class="tray-media">'+img+'</div>':'')+
        '</article>';
    }).join('');
    timeline.querySelectorAll('.tray-card').forEach(function(el,idx){el.style.transitionDelay=el.style.getPropertyValue('--delay');});
  }
  function formatFechaTray(ini,fin){
    if(!ini)return '—';
    var fi=new Date(ini+'-01');
    var ff=fin?new Date(fin+'-01'):null;
    var miab=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    var s=miab[fi.getMonth()]+' '+fi.getFullYear();
    if(ff) s+=' – '+miab[ff.getMonth()]+' '+ff.getFullYear();
    else s+=' – Actualidad';
    return s;
  }
  renderFiltered('todos');
  var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('visible');io.unobserve(en.target);}});},{threshold:.08});
  $$('.reveal').forEach(function(el){io.observe(el);});
}

function initBA(host){
  if(!host)return;
  var wrap=host.querySelector('[data-ba]');
  if(!wrap||wrap===host){wrap=host;}
  var before=wrap.querySelector('[data-ba-before]');
  var clip=wrap.querySelector('[data-ba-clip]');
  var handle=wrap.querySelector('[data-ba-handle]');
  if(!before||!clip||!handle)return;
  function setPos(p){
    p=Math.max(0,Math.min(100,p));
    before.style.clipPath='inset(0 '+(100-p)+'% 0 0)';
    clip.style.left=p+'%';
    handle.style.left=p+'%';
  }
  setPos(50);
  function updateFromEvent(e){
    var r=wrap.getBoundingClientRect();
    var x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    setPos((x/r.width)*100);
  }
  handle.addEventListener('mousedown',function(e){e.preventDefault();wrap.classList.add('dragging');updateFromEvent(e);});
  wrap.addEventListener('mousemove',function(e){if(wrap.classList.contains('dragging'))updateFromEvent(e);});
  document.addEventListener('mouseup',function(){wrap.classList.remove('dragging');});
  handle.addEventListener('touchstart',function(e){e.preventDefault();wrap.classList.add('dragging');updateFromEvent(e);},{passive:false});
  wrap.addEventListener('touchmove',function(e){if(wrap.classList.contains('dragging'))updateFromEvent(e);},{passive:false});
  document.addEventListener('touchend',function(){wrap.classList.remove('dragging');});
}

  SLIDES=[];
  if(t.video&&t.video.tipo&&t.video.tipo!=='ninguno'&&t.video.url)SLIDES.push({tipo:'video',video:t.video});
  (t.imagenes||[]).forEach(function(u){SLIDES.push({tipo:'img',url:u});});
  if(!SLIDES.length)SLIDES.push({tipo:'img',url:''});
  var area=areaDe(t.area)||{};
  $('#modalInfo').innerHTML=
    '<span class="chip" style="--ac:'+esc(area.color||'#a78bfa')+'">'+esc(area.nombre||'')+'</span>'+

    ((t.herramientas||[]).length?'<div><div class="kv-label">Herramientas</div><div class="tools">'+t.herramientas.map(function(h){return '<span class="tool">'+esc(h)+'</span>';}).join('')+'</div></div>':'')+
    beforeAfterHTML(t)+
    ((t.enlaces||[]).length?'<div class="enlaces">'+t.enlaces.map(function(e){return '<a class="btn ghost sm" href="'+esc(e.url)+'" target="_blank" rel="noopener">'+esc(e.texto||'Enlace')+' ↗</a>';}).join('')+'</div>':'');
  var muchos=SLIDES.length>1;
  $('#btnPrev').style.display=muchos?'':'none';
  $('#btnNext').style.display=muchos?'':'none';
  $('#dots').style.display=muchos?'':'none';

  document.body.style.overflow='hidden';
}
function mostrarSlide(i,instant){
  slideIdx=((i%SLIDES.length)+SLIDES.length)%SLIDES.length;
  var host=$('#slideHost');
  var pintar=function(){
    var s=SLIDES[slideIdx];
    if(s.tipo==='video'){
      host.innerHTML=videoHTML(s.video);
    }else if(s.url){
      host.innerHTML='<img src="'+esc(s.url)+'" alt="">'+
        '<button class="modal-zoom" aria-label="Abrir imagen a tamaño completo" title="Ver imagen completa" onclick="openImageInModal(\''+esc(s.url)+'\')">'+
          '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>'+
        '</button>';
    }else{
      host.innerHTML='<div class="sin-media">SIN IMAGEN</div>';
    }
    host.style.opacity=1;
    $('#dots').innerHTML=SLIDES.map(function(_,k){return '<button class="dot'+(k===slideIdx?' active':'')+'" data-i="'+k+'" aria-label="Ir a '+(k+1)+'"></button>';}).join('');
  };
  if(instant){pintar();return;}
  host.style.opacity=0;setTimeout(pintar,180);
}
function cerrarModal(){
  $('#modal').classList.remove('open');
  $('#modal').setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  $('#slideHost').innerHTML='';
}

function openImageInModal(url){
  try{
    var host=$('#slideHost');
    host.innerHTML='<img src="'+esc(url)+'" class="zoomed" alt="" onclick="salirZoom()">';
    host.style.opacity=1;
    // hide navigation/dots when zoomed
    $('#btnPrev').style.display='none';
    $('#btnNext').style.display='none';
    $('#dots').style.display='none';
  }catch(e){
    console.error('openImageInModal error',e);
  }
}
function salirZoom(){
  var muchos=SLIDES.length>1;
  $('#btnPrev').style.display=muchos?'':'none';
  $('#btnNext').style.display=muchos?'':'none';
  $('#dots').style.display=muchos?'':'none';
  mostrarSlide(slideIdx,true);
}
window.openImageInModal=openImageInModal;
window.mostrarSlide=mostrarSlide;
window.salirZoom=salirZoom;
})();
</script>
